<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            width: 600px;
            height: 300px;
             border: 1px solid rgb(207, 188, 163);
        }
        th,td,tex {
            border: 1px solid black;
            padding: 5px;
        }
        th {
            background-color: rgb(197, 127, 255);
        }
        textarea,input[type=text]{
            width: 100%;
            box-sizing: border-box;
        }
        input[type=submit]{
            width: 50%;
        }
        textarea{
            resize: vertical;
        }

    </style>
</head>
<body>
    <table>
        <tr>
        <th>Name</th>
        <th>Value</th>
        </tr>
        <tr>
            <td>Name</td>
            <td><input type="text" name="username"></td>
        </tr>
        <br>
        <tr>
            <td>Sex</td>
            <td>
            <input type="radio" name="Sex" value="Male"> Male
            <br>
            <input type="radio" name="Sex" value="Male"> Female
            </td>
        </tr>
        <br>
        <tr>
        <td>Eye color</td>
        <td>
            <select>
            <option value="green"> green</option>
            <option value="blue"> blue</option>
            <option value="brown"> brown</option>
            </select>
        </td>
    </tr>
    <br>
     <tr>
        <td>Check all that apply</td>
        <td>
            <input type="checkbox"> Over 6 feet tall
            <br>
            <input type="checkbox"> Over 200 pounds
        </td>
    </tr>
    <br>
     <tr>
        <td colspan="2">Describe your athletic ability:
            <textarea  name="ability" rows="8" style="width: 100%; box-sizing; resize: none";></textarea>
        </td>
    </tr>
    <tr>
        <td colspan="2" style="text-align: center; padding: 15px;">
            <input type="submit" value="Enter my information">
        </td>
    </tr>
    </table>
</body>
</html>
